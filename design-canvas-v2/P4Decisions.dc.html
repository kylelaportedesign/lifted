<!doctype html>
<html>
<head><meta charset="utf-8"><script src="./support.js"></script></head>
<body>
<x-dc>
<helmet>
  <style>
    body{margin:0;font-family:'Inter',sans-serif;background:#FBFAF6;color:#0F1310;-webkit-font-smoothing:antialiased}
    .screen{width:390px;height:844px;background:#FBFAF6;overflow:hidden;display:flex;flex-direction:column}
    .content{flex:1;padding:56px 24px 40px;overflow:hidden}
    .display{font-family:'Instrument Serif',Georgia,serif;font-weight:400;letter-spacing:-0.01em;line-height:1.05}
    .label{font-weight:600;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:#4A5651}
    .meta{font-weight:500;font-size:13px;color:#4A5651;line-height:1.55}
    .tabular{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;letter-spacing:-0.02em}
    .btn-back{border:0;background:transparent;padding:0;display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:#4A5651;margin-bottom:8px}
    .row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}
    .card{background:#FFFFFF;border-radius:16px;padding:20px;border:1px solid #E5E1D8;margin-bottom:14px}
    .opt{border:1.5px solid #E5E1D8;border-radius:12px;padding:14px;display:flex;align-items:center;gap:14px;position:relative;background:#FFFFFF}
    .opt.picked{border-color:#1B3A2F;background:#F0F4EE}
    .opt.reco::before{content:'RECOMMENDED';position:absolute;top:-8px;left:12px;background:#1B3A2F;color:#FBFAF6;font-size:9px;font-weight:700;letter-spacing:0.1em;padding:3px 7px;border-radius:4px}
    .swatch{width:56px;height:56px;border-radius:8px;flex-shrink:0}
    .delta-pos{color:#C86B3E;font-weight:700}
    .delta-neg{color:#4A7A50;font-weight:700}
  </style>
</helmet>
<div class="screen">
  <div class="content">
    <button class="btn-back">◃ Project</button>
    <div class="label">Waiting on you</div>
    <div class="display" style="font-size:32px;margin-top:8px">Your patio pavers</div>
    <div class="meta" style="margin-top:6px">Pick one · deadline Friday · Marcus recommends the first</div>

    <div style="display:flex;flex-direction:column;gap:14px;margin-top:24px">
      <div class="opt reco">
        <div class="swatch" style="background:linear-gradient(45deg,#6B6660,#5A554E)"></div>
        <div style="flex:1">
          <div style="font-family:'Instrument Serif',serif;font-size:20px">Slate grey</div>
          <div class="meta" style="font-size:12px">Techo-Bloc Blu 60 · in your allowance</div>
        </div>
        <div class="tabular delta-pos" style="font-size:14px">+$0</div>
      </div>
      <div class="opt picked">
        <div class="swatch" style="background:linear-gradient(45deg,#8A7562,#6B5A4A)"></div>
        <div style="flex:1">
          <div style="font-family:'Instrument Serif',serif;font-size:20px">Sandalwood</div>
          <div class="meta" style="font-size:12px">Techo-Bloc Aberdeen · warmer tone</div>
        </div>
        <div class="tabular delta-pos" style="font-size:14px">+$2,400</div>
      </div>
      <div class="opt">
        <div class="swatch" style="background:linear-gradient(45deg,#3A3A3A,#1F1F1F)"></div>
        <div style="flex:1">
          <div style="font-family:'Instrument Serif',serif;font-size:20px">Charcoal</div>
          <div class="meta" style="font-size:12px">Belgard Mega-Arbel · dramatic</div>
        </div>
        <div class="tabular delta-neg" style="font-size:14px">−$3,100</div>
      </div>
    </div>

    <button style="width:100%;margin-top:24px;padding:18px;background:#1B3A2F;color:#FBFAF6;border:0;border-radius:12px;font-size:15px;font-weight:600">Confirm sandalwood · +$2,400</button>
    <div class="meta" style="text-align:center;margin-top:12px;font-size:12px;font-style:italic">This will generate a change order for you to approve.</div>
  </div>
</div>
</x-dc>
</body>
</html>
