<!doctype html>
<html>
<head><meta charset="utf-8"><script src="./support.js"></script></head>
<body>
<x-dc>
<helmet>
  <style>
    body{margin:0;font-family:'Inter',sans-serif;background:#FBFAF6;color:#0F1310;-webkit-font-smoothing:antialiased}
    .screen{width:390px;height:844px;background:#FBFAF6;overflow:hidden;display:flex;flex-direction:column;position:relative}
    .display{font-family:'Instrument Serif','Newsreader',Georgia,serif;font-weight:400;letter-spacing:-0.01em;line-height:1.05}
    .display em{font-style:italic;color:#1B3A2F}
    .heading{font-family:'Inter',sans-serif;font-weight:600;letter-spacing:-0.02em}
    .label{font-weight:600;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:#4A5651}
    .meta{font-weight:500;font-size:14px;color:#4A5651;letter-spacing:-0.005em;line-height:1.55}
    .tabular{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;letter-spacing:-0.02em}
    /* full-bleed hero render */
    .hero{position:relative;height:420px;background:linear-gradient(180deg,#7A968C 0%,#4A6B6B 35%,#5C6B4A 35.1%,#3D4A2E 100%);overflow:hidden}
    .hero::before{content:'';position:absolute;top:22%;left:15%;right:15%;bottom:30%;background:linear-gradient(180deg,rgba(200,107,62,0.35),rgba(122,108,85,0.7));border-radius:6px;box-shadow:0 20px 40px rgba(0,0,0,0.2)}
    .hero::after{content:'';position:absolute;bottom:0;left:0;right:0;height:60%;background:linear-gradient(180deg,transparent,rgba(15,19,16,0.5))}
    .hero-topbar{position:absolute;top:56px;left:24px;right:24px;display:flex;align-items:center;justify-content:space-between;z-index:2}
    .brand{color:#FBFAF6;font-family:'Instrument Serif',serif;font-size:18px;letter-spacing:0.02em}
    .hero-meta{position:absolute;bottom:24px;left:24px;right:24px;z-index:2;color:#FBFAF6}
    .content{padding:32px 24px 60px}
    .card-airy{padding:24px 20px;background:#FFFFFF;border-radius:16px;border:1px solid #E5E1D8;box-shadow:0 1px 3px rgba(15,19,16,0.04)}
    .cta{display:block;width:100%;padding:18px;background:#1B3A2F;color:#FBFAF6;border:0;border-radius:12px;font-family:'Inter',sans-serif;font-size:15px;font-weight:600;letter-spacing:-0.005em;text-align:center;box-shadow:0 4px 12px rgba(27,58,47,0.15)}
    .phase-bar{height:6px;background:#E5E1D8;border-radius:3px;position:relative;overflow:hidden}
    .phase-fill{position:absolute;left:0;top:0;height:100%;background:linear-gradient(90deg,#1B3A2F,#C86B3E);border-radius:3px}
    .row{display:flex;align-items:center;gap:12px}
    .between{justify-content:space-between}
  </style>
</helmet>
<div class="screen">
  <div class="hero">
    <div class="hero-topbar">
      <div class="brand">Ridgeline</div>
      <div style="width:32px;height:32px;border-radius:50%;background:rgba(251,250,246,0.2);backdrop-filter:blur(8px);color:#FBFAF6;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600">R</div>
    </div>
    <div class="hero-meta">
      <div style="font-size:11px;letter-spacing:0.18em;text-transform:uppercase;opacity:0.7">Your project</div>
      <div class="display" style="font-size:36px;color:#FBFAF6;margin-top:6px">The Cotter backyard</div>
    </div>
  </div>

  <div class="content">
    <div style="margin-bottom:28px">
      <div class="label">This week</div>
      <div class="display" style="font-size:32px;margin-top:10px">
        Concrete pour starts <em>Wednesday.</em>
      </div>
    </div>

    <div class="card-airy" style="margin-bottom:16px">
      <div class="row between">
        <div>
          <div style="font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:#4A5651;font-weight:600">Waiting on you</div>
          <div style="font-family:'Instrument Serif',serif;font-size:22px;margin-top:6px">Pick your patio pavers</div>
          <div class="meta" style="font-size:13px;margin-top:4px">3 options · deadline Friday</div>
        </div>
        <div style="width:44px;height:44px;border-radius:50%;background:#C86B3E;color:#FBFAF6;display:flex;align-items:center;justify-content:center;font-size:20px">→</div>
      </div>
    </div>

    <div class="card-airy" style="margin-bottom:24px">
      <div class="row between" style="margin-bottom:14px">
        <div class="label" style="font-size:10px;letter-spacing:0.12em">Phase 3 of 6 · concrete</div>
        <div class="tabular" style="font-size:12px;color:#4A5651">40% complete</div>
      </div>
      <div class="phase-bar"><div class="phase-fill" style="width:40%"></div></div>
      <div class="meta" style="font-size:13px;margin-top:10px">Rivera Concrete on site · pour day 2 tomorrow</div>
    </div>

    <button class="cta">Explore the design</button>
  </div>
</div>
</x-dc>
</body>
</html>
