<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body{margin:0;font-family:'Inter',system-ui,sans-serif;background:#F2F0E8;color:#0A0A0A;-webkit-font-smoothing:antialiased}
    .screen{width:390px;height:844px;background:#F2F0E8;overflow:hidden;display:flex;flex-direction:column}
    .content{flex:1;padding:64px 20px 100px;overflow:hidden}
    .display{font-family:'Archivo','Manrope',system-ui,sans-serif;font-weight:800;letter-spacing:-0.02em;line-height:0.92}
    .display-md{font-family:'Archivo','Manrope',system-ui,sans-serif;font-weight:800;letter-spacing:-0.02em;line-height:0.95}
    .label{font-weight:600;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#0A0A0A}
    .label-muted{font-weight:600;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#7A7A70}
    .meta{font-weight:500;font-size:13px;color:#7A7A70;letter-spacing:-0.005em}
    .tabular{font-variant-numeric:tabular-nums}
    .card{background:#FAF9F2;border-radius:16px;padding:16px;border:0.5px solid rgba(10,10,10,0.04)}
    .hero-yellow{background:#F5F500;border-radius:20px;padding:22px 22px 24px;color:#0A0A0A}
    .row{display:flex;align-items:center;gap:10px}
    .between{justify-content:space-between}
    .back{border:0;background:rgba(10,10,10,0.05);border-radius:18px;padding:8px 12px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
    .pin{position:absolute;transform:translate(-50%,-100%);filter:drop-shadow(0 2px 2px rgba(0,0,0,0.25))}
  </style>
</helmet>
<div class="screen">
  <div class="content">
    <button class="back" style="margin-bottom:16px">
      <svg width="12" height="14" viewBox="0 0 8 14"><path d="M7 1L1 7l6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Today
    </button>

    <div class="display" style="font-size:48px;letter-spacing:-0.03em;line-height:0.92">Where work<br>happens.</div>

    <!-- Google Maps-style world map -->
    <div class="card" style="margin-top:20px;padding:0;overflow:hidden">
      <div style="height:200px;position:relative;background:#AAD3DF">
        <svg viewBox="0 0 100 80" width="100%" height="100%" preserveAspectRatio="none" style="position:absolute;inset:0">
          <defs>
            <pattern id="tex" patternUnits="userSpaceOnUse" width="6" height="6">
              <rect width="6" height="6" fill="#E8EEF4"/>
              <circle cx="1" cy="1" r="0.18" fill="#D6DEE6"/>
              <circle cx="4" cy="3" r="0.14" fill="#D6DEE6"/>
            </pattern>
          </defs>
          <path d="M 8 22 L 14 18 L 20 16 L 24 18 L 26 22 L 24 26 L 28 28 L 30 32 L 28 36 L 24 38 L 22 36 L 18 36 L 14 32 L 12 28 L 10 26 Z M 30 50 L 34 48 L 36 52 L 38 58 L 36 64 L 32 68 L 28 64 L 28 58 Z M 46 22 L 52 20 L 56 22 L 58 26 L 56 30 L 50 30 L 46 28 Z M 48 36 L 54 34 L 58 36 L 60 42 L 58 50 L 54 56 L 50 58 L 48 54 L 46 46 L 46 40 Z M 56 18 L 64 16 L 72 18 L 80 20 L 86 24 L 88 30 L 84 34 L 78 34 L 74 32 L 68 32 L 64 30 L 60 28 L 58 26 Z M 66 36 L 72 36 L 74 42 L 72 46 L 68 46 L 66 42 Z M 80 56 L 88 56 L 92 60 L 90 64 L 84 66 L 80 64 L 78 60 Z" fill="url(#tex)" stroke="#C7CDD3" stroke-width="0.22"/>
          <g fill="#6B7480" font-family="system-ui,sans-serif" font-size="2" font-weight="500" text-anchor="middle" letter-spacing="0.08">
            <text x="18" y="28">USA</text><text x="32" y="58">BRAZIL</text><text x="52" y="42">AFRICA</text><text x="70" y="26">ASIA</text><text x="51" y="25">EU</text><text x="85" y="61">AUSTRALIA</text>
          </g>
        </svg>
        <!-- search pill -->
        <div style="position:absolute;top:10px;left:10px;right:50px;background:#fff;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.15);display:flex;align-items:center;gap:8px;padding:7px 10px;font-size:11px;color:#5F6368">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#5F6368" stroke-width="2"/><path d="M16 16L21 21" stroke="#5F6368" stroke-width="2" stroke-linecap="round"/></svg>
          <span style="flex:1">Search team locations</span>
        </div>
        <!-- zoom -->
        <div style="position:absolute;right:10px;top:10px;background:#fff;border-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,0.15)">
          <div style="width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:#5F6368;font-size:16px;border-bottom:1px solid #E8E8E8">+</div>
          <div style="width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:#5F6368;font-size:16px">−</div>
        </div>
        <!-- pins (dark) -->
        <div class="pin" style="left:34%;top:55%;width:24px;height:30px"><svg width="24" height="30" viewBox="0 0 24 30"><path d="M12 0C5.4 0 0 5.4 0 12c0 9 12 18 12 18s12-9 12-18C24 5.4 18.6 0 12 0z" fill="#0A0A0A"/><circle cx="12" cy="12" r="9" fill="#fff"/></svg></div>
        <div class="pin" style="left:71%;top:38%;width:24px;height:30px"><svg width="24" height="30" viewBox="0 0 24 30"><path d="M12 0C5.4 0 0 5.4 0 12c0 9 12 18 12 18s12-9 12-18C24 5.4 18.6 0 12 0z" fill="#0A0A0A"/><circle cx="12" cy="12" r="9" fill="#fff"/></svg></div>
        <div class="pin" style="left:47%;top:25%;width:24px;height:30px"><svg width="24" height="30" viewBox="0 0 24 30"><path d="M12 0C5.4 0 0 5.4 0 12c0 9 12 18 12 18s12-9 12-18C24 5.4 18.6 0 12 0z" fill="#0A0A0A"/><circle cx="12" cy="12" r="9" fill="#fff"/></svg></div>
        <div class="pin" style="left:51%;top:38%;width:24px;height:30px"><svg width="24" height="30" viewBox="0 0 24 30"><path d="M12 0C5.4 0 0 5.4 0 12c0 9 12 18 12 18s12-9 12-18C24 5.4 18.6 0 12 0z" fill="#0A0A0A"/><circle cx="12" cy="12" r="9" fill="#fff"/></svg></div>
        <!-- yellow active pin (Maya) -->
        <div class="pin" style="left:23%;top:32%;width:34px;height:42px;z-index:3"><svg width="34" height="42" viewBox="0 0 24 30"><path d="M12 0C5.4 0 0 5.4 0 12c0 9 12 18 12 18s12-9 12-18C24 5.4 18.6 0 12 0z" fill="#F4C842"/><circle cx="12" cy="12" r="9" fill="#fff"/></svg></div>
        <div style="position:absolute;bottom:4px;left:8px;font-family:system-ui,sans-serif;font-size:14px;font-weight:500;letter-spacing:-0.01em">
          <span style="color:#4285F4">G</span><span style="color:#EA4335">o</span><span style="color:#FBBC04">o</span><span style="color:#4285F4">g</span><span style="color:#34A853">l</span><span style="color:#EA4335">e</span>
        </div>
      </div>
      <div style="padding:18px">
        <div class="meta">9 contractors · 8 countries · 6 timezones</div>
        <div class="display-md" style="font-size:22px;letter-spacing:-0.02em;margin-top:4px">Maya is online in Mexico City.</div>
      </div>
    </div>

    <!-- Spend hero -->
    <div class="hero-yellow" style="margin-top:12px">
      <span class="label">Spend · April</span>
      <div class="display tabular" style="font-size:64px;letter-spacing:-0.04em;line-height:0.85;margin-top:18px">$142,308</div>
      <div class="row between" style="margin-top:10px">
        <span class="meta" style="color:rgba(10,10,10,0.7)">vs March $120,180</span>
        <span class="label tabular">+18.4%</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
