<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body{margin:0;font-family:'Inter',system-ui,sans-serif;background:#F2F0E8;color:#0A0A0A;-webkit-font-smoothing:antialiased}
    .screen{width:390px;height:844px;background:#F2F0E8;overflow:hidden;display:flex;flex-direction:column}
    .content{flex:1;padding:64px 20px 100px;overflow:hidden}
    .display{font-family:'Archivo','Manrope',system-ui,sans-serif;font-weight:800;letter-spacing:-0.02em;line-height:0.92}
    .display-md{font-family:'Archivo','Manrope',system-ui,sans-serif;font-weight:800;letter-spacing:-0.02em;line-height:0.95}
    .label{font-weight:600;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#0A0A0A}
    .label-muted{font-weight:600;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#7A7A70}
    .meta{font-weight:500;font-size:13px;color:#7A7A70;letter-spacing:-0.005em}
    .tabular{font-variant-numeric:tabular-nums}
    .card{background:#FAF9F2;border-radius:16px;padding:16px;border:0.5px solid rgba(10,10,10,0.04)}
    .hero-yellow{background:#F5F500;border-radius:20px;padding:22px 22px 24px;color:#0A0A0A}
    .row{display:flex;align-items:center;gap:10px}
    .between{justify-content:space-between}
    .back{border:0;background:rgba(10,10,10,0.05);border-radius:18px;padding:8px 12px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
    .dot.success{background:#00B87C;display:inline-block;width:6px;height:6px;border-radius:50%;vertical-align:middle;margin-right:6px}
    .map-pin{position:absolute;width:24px;height:24px;border-radius:50%;border:2px solid #F2F0E8;transform:translate(-50%,-50%);background:#0A0A0A}
    .avatar-mini{position:absolute;inset:2px;border-radius:50%;background:#A39E85;color:#0A0A0A;display:flex;align-items:center;justify-content:center;font-family:'Archivo',sans-serif;font-weight:700;font-size:9px}
  </style>
</helmet>
<div class="screen">
  <div class="content">
    <button class="back" style="margin-bottom:16px">
      <svg width="12" height="14" viewBox="0 0 8 14"><path d="M7 1L1 7l6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Today
    </button>

    <div class="display" style="font-size:56px;letter-spacing:-0.035em;line-height:0.92">Where work<br>happens.</div>

    <!-- World map (bone/sand — the profile/dashboard variant) -->
    <div class="card" style="margin-top:20px;padding:0;overflow:hidden">
      <div style="height:220px;position:relative;background:linear-gradient(135deg,#dad6c5,#c8c4b0)">
        <svg viewBox="0 0 100 80" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
          <rect width="100" height="80" fill="#C8C4B0"/>
          <path d="M 8 22 L 14 18 L 20 16 L 24 18 L 26 22 L 24 26 L 28 28 L 30 32 L 28 36 L 24 38 L 22 36 L 18 36 L 14 32 L 12 28 L 10 26 Z M 30 50 L 34 48 L 36 52 L 38 58 L 36 64 L 32 68 L 28 64 L 28 58 Z M 46 22 L 52 20 L 56 22 L 58 26 L 56 30 L 50 30 L 46 28 Z M 48 36 L 54 34 L 58 36 L 60 42 L 58 50 L 54 56 L 50 58 L 48 54 L 46 46 L 46 40 Z M 56 18 L 64 16 L 72 18 L 80 20 L 86 24 L 88 30 L 84 34 L 78 34 L 74 32 L 68 32 L 64 30 L 60 28 L 58 26 Z M 80 56 L 88 56 L 92 60 L 90 64 L 84 66 L 80 64 L 78 60 Z" fill="#A39E85"/>
          <g stroke="#B5B4B0" stroke-width="0.2" opacity="0.5">
            <line x1="0" y1="20" x2="100" y2="20"/><line x1="0" y1="40" x2="100" y2="40"/><line x1="0" y1="60" x2="100" y2="60"/>
          </g>
        </svg>
        <div class="map-pin" style="left:34%;top:55%"><div class="avatar-mini" style="background:#7A7A70">CR</div></div>
        <div class="map-pin" style="left:71%;top:38%"><div class="avatar-mini">PI</div></div>
        <div class="map-pin" style="left:47%;top:25%"><div class="avatar-mini" style="background:#4A5547;color:#E8E4DA">NM</div></div>
        <div class="map-pin" style="left:51%;top:38%"><div class="avatar-mini" style="background:#B5B4B0">TA</div></div>
        <!-- yellow pin (Maya) -->
        <div class="map-pin" style="left:23%;top:32%;background:#F5F500;width:32px;height:32px;z-index:2"><div class="avatar-mini" style="inset:3px;font-size:11px">MC</div></div>
      </div>
      <div style="padding:18px">
        <div class="meta">9 contractors · 8 countries · 6 timezones</div>
        <div class="display-md" style="font-size:22px;letter-spacing:-0.02em;margin-top:4px">Maya is online in Mexico City.</div>
      </div>
    </div>

    <!-- Spend hero -->
    <div class="hero-yellow" style="margin-top:12px">
      <span class="label">Spend · April</span>
      <div class="display tabular" style="font-size:64px;letter-spacing:-0.04em;line-height:0.85;margin-top:18px">$142,308</div>
      <div class="row between" style="margin-top:10px">
        <span class="meta" style="color:rgba(10,10,10,0.7)">vs March $120,180</span>
        <span class="label tabular">+18.4%</span>
      </div>
    </div>

    <!-- Metric grid -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px">
      <div class="card">
        <span class="label-muted">Active</span>
        <div class="display-md tabular" style="font-size:36px;margin-top:6px">16</div>
        <div class="meta" style="margin-top:4px">contractors</div>
      </div>
      <div class="card">
        <span class="label-muted">Compliant</span>
        <div class="display-md tabular" style="font-size:36px;margin-top:6px">12<span style="font-size:18px;color:#7A7A70">/16</span></div>
        <div class="row" style="gap:4px;margin-top:4px"><span class="dot success"></span><span class="meta">3 pending · 1 reject</span></div>
      </div>
      <div class="card">
        <span class="label-muted">Avg days to pay</span>
        <div class="display-md tabular" style="font-size:36px;margin-top:6px">1.2</div>
        <svg viewBox="0 0 60 18" width="100%" height="22" style="margin-top:6px" preserveAspectRatio="none"><polyline points="0,14 10,12 20,11 30,8 40,6 50,5 60,4" fill="none" stroke="#0A0A0A" stroke-width="1.4"/></svg>
      </div>
      <div class="card">
        <span class="label-muted">Signed (30d)</span>
        <div class="display-md tabular" style="font-size:36px;margin-top:6px">08</div>
        <svg viewBox="0 0 60 18" width="100%" height="22" style="margin-top:6px" preserveAspectRatio="none"><polyline points="0,14 10,10 20,12 30,8 40,9 50,5 60,3" fill="none" stroke="#0A0A0A" stroke-width="1.4"/></svg>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
