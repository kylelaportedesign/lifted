<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body{margin:0;font-family:'Inter',system-ui,sans-serif;background:#F2F0E8;color:#0A0A0A;-webkit-font-smoothing:antialiased}
    .screen{width:390px;height:844px;background:rgba(10,10,10,0.4);overflow:hidden;position:relative}
    /* dim backdrop plus a hint of the preview */
    .backdrop{position:absolute;inset:0;background:linear-gradient(180deg,#F2F0E8 0%,#F2F0E8 30%,rgba(10,10,10,0.4) 30.1%,rgba(10,10,10,0.4) 100%)}
    .backdrop::before{content:'';position:absolute;left:20px;right:20px;top:80px;height:120px;background:#F5F500;border-radius:20px;opacity:0.6}
    .sheet{position:absolute;left:0;right:0;bottom:0;background:#F2F0E8;border-radius:24px 24px 0 0;padding:8px 20px 36px;max-height:88%;overflow:hidden}
    .sheet-handle{width:36px;height:5px;border-radius:3px;background:rgba(10,10,10,0.18);margin:8px auto 18px}
    .display{font-family:'Archivo','Manrope',system-ui,sans-serif;font-weight:800;letter-spacing:-0.03em;line-height:0.92;font-size:48px}
    .label{font-weight:600;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#0A0A0A}
    .label-muted{font-weight:600;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#7A7A70}
    .meta{font-weight:500;font-size:13px;color:#7A7A70;letter-spacing:-0.005em}
    .tabular{font-variant-numeric:tabular-nums}
    .row{display:flex;align-items:center;justify-content:space-between}
    .slide-track{position:relative;height:64px;border-radius:32px;background:#0A0A0A;overflow:hidden}
    .slide-fill{position:absolute;top:0;left:0;bottom:0;width:64px;background:rgba(245,245,0,0.18)}
    .slide-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(242,240,232,0.6);font-weight:600;font-size:14px;letter-spacing:0.06em;text-transform:uppercase}
    .slide-knob{position:absolute;top:6px;left:6px;width:52px;height:52px;border-radius:50%;background:#F5F500;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(245,245,0,0.4)}
  </style>
</helmet>
<div class="screen">
  <div class="backdrop"></div>
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="label-muted">Confirm payroll run</div>
    <div class="display tabular" style="margin-top:8px">$38,420</div>
    <div class="meta" style="margin-top:4px">to 9 contractors · across 8 countries</div>

    <div style="margin-top:22px;padding:14px;background:#E8E6DF;border-radius:14px">
      <div class="row"><span class="label-muted">Funding source</span><span class="label">Mercury · ••3047</span></div>
      <div style="height:1px;background:rgba(10,10,10,0.08);margin:12px 0"></div>
      <div class="row"><span class="label-muted">Estimated delivery</span><span class="label">Within 6 hours</span></div>
      <div style="height:1px;background:rgba(10,10,10,0.08);margin:12px 0"></div>
      <div class="row"><span class="label-muted">Total Lifted fees</span><span class="label tabular">$13.50</span></div>
    </div>

    <div class="slide-track" style="margin-top:22px">
      <div class="slide-fill"></div>
      <div class="slide-label">Slide to send  →</div>
      <div class="slide-knob">
        <svg width="22" height="22" viewBox="0 0 22 22"><path d="M3 11h16M13 5l6 6-6 6" stroke="#0A0A0A" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>

    <button style="width:100%;margin-top:16px;height:48px;border:0;background:transparent;color:#7A7A70;font-weight:600;font-size:13px;letter-spacing:0.04em;text-transform:uppercase">Cancel</button>
  </div>
</div>
</x-dc>
</body>
</html>
