<!doctype html>
<html>
<head>

<x-dc>

    .screen{width:390px;height:844px;background:#F2F0E8;overflow:hidden;display:flex;flex-direction:column;padding:64px 20px 24px}

    .label{font-weight:600;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#0A0A0A}
    .meta{font-weight:500;font-size:13px;letter-spacing:-0.005em}
    .back{border:0;background:rgba(10,10,10,0.05);border-radius:18px;padding:8px 12px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;align-self:flex-start}

  </style>
</helmet>
<div class="screen">
  <button class="back" style="margin-bottom:16px">
    <svg width="12" height="14" viewBox="0 0 8 14"><path d="M7 1L1 7l6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Today
  </button>
  <div style="height:2px;background:#F5F500;margin-bottom:24px"></div>

  <div class="hero-yellow">
    <span class="label">Welcome to Lifted</span>
    <div class="display" style="font-size:88px;margin-top:22px">00</div>
    <div class="meta" style="color:rgba(10,10,10,0.7);margin-top:6px">contractors engaged</div>
    <div class="display-md" style="margin-top:22px">Invite your first.</div>
  </div>

  <div style="flex:1"></div>
  <button style="width:100%;height:56px;border-radius:28px;border:0;background:#0A0A0A;color:#F2F0E8;font-weight:700;font-size:14px;letter-spacing:0.04em;text-transform:uppercase">Open Today</button>
</div>
</x-dc>
</body>
</html>
