<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body{margin:0;font-family:'Inter',system-ui,sans-serif;background:#F2F0E8;color:#0A0A0A;-webkit-font-smoothing:antialiased}
    .screen{width:390px;height:844px;background:#F2F0E8;overflow:hidden;display:flex;flex-direction:column;padding:64px 20px 24px}
    .display-md{font-family:'Archivo','Manrope',system-ui,sans-serif;font-weight:800;letter-spacing:-0.03em;line-height:0.95;font-size:36px}
    .meta{font-weight:500;font-size:13px;color:#7A7A70;letter-spacing:-0.005em}
    .back{border:0;background:rgba(10,10,10,0.05);border-radius:18px;padding:8px 12px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;align-self:flex-start}
    .card{background:#FAF9F2;border-radius:16px;padding:0;overflow:hidden;border:0.5px solid rgba(10,10,10,0.04)}
    .frow{padding:18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .frow + .frow{border-top:0.5px solid #E8E6DF}
    .fico{width:36px;height:36px;border-radius:9px;background:#E8E6DF}
  </style>
</helmet>
<div class="screen">
  <button class="back" style="margin-bottom:16px">
    <svg width="12" height="14" viewBox="0 0 8 14"><path d="M7 1L1 7l6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Today
  </button>
  <div style="height:2px;background:#E8E6DF;margin-bottom:24px;position:relative">
    <div style="position:absolute;left:0;top:0;height:100%;width:95%;background:#F5F500"></div>
  </div>

  <div class="display-md">Connect funding.</div>
  <div class="meta" style="margin-top:8px">ACH, SEPA, SWIFT, plus local rails in 150 countries.</div>

  <div class="card" style="margin-top:24px">
    <div class="frow">
      <div style="display:flex;align-items:center;gap:12px"><div class="fico"></div><div style="font-weight:600;font-size:15px">Mercury · Business checking</div></div>
      <svg width="8" height="14" viewBox="0 0 8 14"><path d="M1 1l6 6-6 6" stroke="#7A7A70" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="frow">
      <div style="display:flex;align-items:center;gap:12px"><div class="fico"></div><div style="font-weight:600;font-size:15px">Brex · Operating account</div></div>
      <svg width="8" height="14" viewBox="0 0 8 14"><path d="M1 1l6 6-6 6" stroke="#7A7A70" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="frow">
      <div style="display:flex;align-items:center;gap:12px"><div class="fico"></div><div style="font-weight:600;font-size:15px">Wire transfer · Manual</div></div>
      <svg width="8" height="14" viewBox="0 0 8 14"><path d="M1 1l6 6-6 6" stroke="#7A7A70" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
  </div>

  <div style="flex:1"></div>
  <button style="width:100%;height:56px;border-radius:28px;border:0;background:#0A0A0A;color:#F2F0E8;font-weight:700;font-size:14px;letter-spacing:0.04em;text-transform:uppercase">Continue</button>
</div>
</x-dc>
</body>
</html>
